<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05090f">
  <title>爱弥斯 · 本地赛博伴侣</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/channel-controls.css">
</head>
<body>
  <main class="scene" data-state="booting">
    <div class="portrait" aria-hidden="true"></div>
    <div class="portrait-aura" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="veil" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">A</span>
        <div><strong>爱弥斯</strong><small>AEMEATH / LOCAL COMPANION</small></div>
      </div>
      <div class="telemetry">
        <span id="brain-pill" class="pill"><i></i>大脑连接中</span>
        <span id="voice-pill" class="pill"><i></i>离线语音</span>
        <span id="mic-pill" class="pill"><i></i>麦克风待命</span>
        <select id="microphone-select" class="device-select" aria-label="选择麦克风">
          <option value="">Windows 默认麦克风</option>
        </select>
        <button id="clear-button" class="ghost-button" title="清除本机对话记忆">清除记忆</button>
      </div>
    </header>

    <section class="presence" aria-live="polite">
      <div class="orb-wrap">
        <div class="orbit orbit-a"></div>
        <div class="orbit orbit-b"></div>
        <div class="wave-ring"></div>
        <button id="listen-button" class="orb" aria-label="开始聆听">
          <span class="orb-core"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5.5a4 4 0 0 0 4 4Zm-6.5-4a.75.75 0 0 1 1.5 0 5 5 0 0 0 10 0 .75.75 0 0 1 1.5 0 6.5 6.5 0 0 1-5.75 6.46V21h2.5a.75.75 0 0 1 0 1.5h-6.5a.75.75 0 0 1 0-1.5h2.5v-3.04A6.5 6.5 0 0 1 5.5 11.5Z"/></svg>
        </button>
      </div>

      <div class="status-copy">
        <span id="eyebrow">PRIVATE CHANNEL</span>
        <h1 id="state-title">正在初始化</h1>
        <p id="state-detail">声音与人物在本机，对话通道由你选择</p>
      </div>

      <div class="dialogue">
        <div id="speaker-label" class="speaker-label">爱弥斯</div>
        <p id="subtitle">我在这里。点一下光核，就可以和我说话。</p>
      </div>
    </section>

    <footer class="composer">
      <form id="text-form">
        <input id="text-input" maxlength="220" autocomplete="off" placeholder="也可以先打字试试……" aria-label="输入消息">
        <button type="submit" aria-label="发送">
          <svg viewBox="0 0 24 24"><path d="m3.4 20.4 17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a1 1 0 0 0-1.36 1.14l1.4 5.62 9.06 1.64-9.06 1.64-1.4 5.62A1 1 0 0 0 3.4 20.4Z"/></svg>
        </button>
      </form>
      <div id="privacy-channel" class="privacy-note">本地识别与声音 · 对话通道检查中</div>
    </footer>

    <div id="toast" class="toast" role="alert"></div>
  </main>
  <script src="/app.js?v=20260813-voxcpm2-stream"></script>
  <script src="/channel-controls.js"></script>
</body>
</html>
